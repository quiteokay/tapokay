<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>tap okay</title>
<meta name="theme-color" content="#1a120d">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-title" content="tap okay">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* A small European café on a December evening: bookshelves, a snowy market window, Glühwein on the table.
   One book, lying on its side, reads "It's Okay to Be Different". Single look on purpose. */
:root {
  --night: #1a120d;
  --card: #2a1d16;
  --card-edge: #5a3e2b;
  --gold: #d9bf7a;
  --mulled: #b8282b;
  --ink: #f3e9d8;
  --muted: #b7a58e;
  --font-book: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#scene { opacity: 0; transition: opacity 0.6s ease; }
#scene.on { opacity: 1; }
#fx { pointer-events: none; }
#book {
  position: absolute; border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer;
  border-radius: 4px; -webkit-tap-highlight-color: transparent; transition: transform 0.25s ease;
}
#book::after {
  content: ""; position: absolute; inset: -40% -12%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 214, 140, 0.22), rgba(255, 214, 140, 0));
  opacity: 0; transition: opacity 0.4s ease;
}
#book:hover::after, #book:focus-visible::after { opacity: 1; }
#book:focus-visible { outline: 1px solid rgba(243, 233, 216, 0.45); outline-offset: 3px; }
.veil { position: fixed; inset: 0; background: rgba(10, 6, 4, 0.55); opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
.veil.on { opacity: 1; pointer-events: auto; }
form#gate {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -46%);
  width: min(360px, calc(100vw - 32px)); box-sizing: border-box;
  background: linear-gradient(160deg, #36261c, var(--card) 60%);
  border: 1px solid var(--card-edge); border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 12px;
  opacity: 0; transition: opacity 0.35s ease, transform 0.35s ease;
}
form#gate.on { opacity: 1; transform: translate(-50%, -50%); }
form#gate h1 { font: italic 500 27px/1.1 var(--font-book); color: var(--gold); margin: 0; padding-right: 30px; }
form#gate p { margin: 0; font-size: 13.5px; color: var(--muted); }
.row { display: flex; gap: 8px; }
#pass {
  flex: 1; min-width: 0; font: 500 16px var(--font-body); color: var(--ink);
  background: rgba(0, 0, 0, 0.28); border: 1px solid var(--card-edge); border-radius: 9px; padding: 10px 12px;
}
#pass:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: transparent; }
#enter { font: 600 15px var(--font-body); color: #fff4e8; background: var(--mulled); border: 0; border-radius: 9px; padding: 0 16px; cursor: pointer; }
#enter:disabled { opacity: 0.6; cursor: default; }
#enter:focus-visible, #close:focus-visible, label:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }
label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; border-radius: 6px; width: fit-content; }
label input { accent-color: var(--mulled); width: 16px; height: 16px; margin: 0; }
#msg { min-height: 18px; font-size: 13.5px; color: #f0a48f; }
#close { position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
.shake { animation: shake 0.38s ease; }
@keyframes shake { 20%, 60% { margin-left: -8px; } 40%, 80% { margin-left: 8px; } }
@media (prefers-reduced-motion: reduce) {
  #scene, form#gate, .veil, #book, #book::after { transition: none; }
  .shake { animation: none; }
}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="book" type="button" aria-label="It's Okay to Be Different"></button>
<div class="veil" id="veil"></div>
<form id="gate" hidden autocomplete="on">
  <button type="button" id="close" aria-label="Close">&times;</button>
  <h1>It's Okay to Be Different</h1>
  <p>This shelf is private.</p>
  <input type="text" name="username" value="okay" autocomplete="username" hidden>
  <div class="row">
    <input id="pass" name="password" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase" required>
    <button id="enter" type="submit">Open</button>
  </div>
  <label><input type="checkbox" id="remember" checked> Remember this device</label>
  <div id="msg" role="status" aria-live="polite"></div>
</form>

<script>
(function () {
  var cv = document.getElementById("scene"), ctx = cv.getContext("2d");
  var fx = document.getElementById("fx"), fc = fx.getContext("2d");
  var bookBtn = document.getElementById("book");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W, H, S, dpr, L = {}, flakes = [], raf = 0;
  var TITLE = "IT’S OKAY TO BE DIFFERENT";

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function star(g, cx, cy, ro, ri, n, rot) {
    g.beginPath();
    for (var i = 0; i < n * 2; i++) { var r = i % 2 ? ri : ro, a = rot + i * Math.PI / n; g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
    g.closePath();
  }
  var BOOK = ["#6d1f26", "#7f2a22", "#2d4a3a", "#21384f", "#4a2f4f", "#8a6a2c", "#d8cbb0", "#3b5c58", "#5a3a22", "#9b3d2a", "#2f2f45", "#6b6b3a", "#b49a6a", "#40291c"];
  function bookFont(px) { return "700 " + px + "px " + getComputedStyle(document.documentElement).getPropertyValue("--font-book"); }

  function drawScene() {
    var R = rng(1225), g = ctx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    var narrow = W < 700;
    var tableY = Math.round(H * (narrow ? 0.8 : 0.78));
    L.tableY = tableY;

    // warm plaster wall
    var wall = g.createLinearGradient(0, 0, 0, tableY);
    wall.addColorStop(0, "#2a1c15"); wall.addColorStop(1, "#3a271c");
    g.fillStyle = wall; g.fillRect(0, 0, W, tableY);

    // window onto the Christmas market
    // shelf grid first, so the window sits exactly in one bay
    var shelfTop = H * 0.05, board = 9 * S, upright = 12 * S;
    var nRows = Math.max(3, Math.floor((tableY - shelfTop - 8) / Math.max(96, Math.min(150, H * 0.15))));
    var shelfH = (tableY - shelfTop - 8) / nRows;
    var rows = []; for (var ri0 = 0; ri0 < nRows; ri0++) rows.push(shelfTop + ri0 * shelfH);
    var bayW = narrow ? W * 0.56 : Math.max(190, Math.min(270, W / 4.6));
    var bays = []; for (var x = W * (narrow ? 0.5 : 0.27) - bayW * 1.5; x < W; x += bayW) bays.push(x);
    var winRows = narrow ? Math.max(1, nRows - 2) : Math.max(2, Math.round(nRows * 0.6));
    var wx = bays[1] + upright / 2 + 10 * S, ww = bayW - upright - 20 * S;
    var wy = shelfTop + 10 * S, wh = rows[winRows - 1] + shelfH - wy - 22 * S;
    L.win = { x: wx, y: wy, w: ww, h: wh };
    function arch(gg, yb) { gg.beginPath(); gg.moveTo(wx, yb); gg.lineTo(wx, wy + ww / 2); gg.arc(wx + ww / 2, wy + ww / 2, ww / 2, Math.PI, 0); gg.lineTo(wx + ww, yb); gg.closePath(); }
    g.save();
    arch(g, wy + wh); g.clip();
    var sky = g.createLinearGradient(0, wy, 0, wy + wh);
    sky.addColorStop(0, "#0d1628"); sky.addColorStop(1, "#2a3550");
    g.fillStyle = sky; g.fillRect(wx, wy, ww, wh);
    var ground = wy + wh * 0.82;
    for (var bx = wx - 10; bx < wx + ww; bx += ww * 0.22) {
      var bh = wh * (0.22 + R() * 0.2), bw = ww * 0.2;
      g.fillStyle = "#151c2b";
      g.beginPath(); g.moveTo(bx, ground); g.lineTo(bx, ground - bh); g.lineTo(bx + bw / 2, ground - bh - bw * 0.45); g.lineTo(bx + bw, ground - bh); g.lineTo(bx + bw, ground); g.fill();
      g.fillStyle = "rgba(255,196,110,0.75)";
      for (var k = 0; k < 3; k++) if (R() < 0.6) g.fillRect(bx + bw * (0.2 + k * 0.25), ground - bh * (0.35 + R() * 0.4), bw * 0.1, bw * 0.12);
    }
    g.fillStyle = "#e9edf2"; g.fillRect(wx, ground, ww, wh);
    for (var h = 0; h < 3; h++) {
      var hx = wx + ww * (0.08 + h * 0.32), hw = ww * 0.26, hy = ground - wh * 0.13;
      g.fillStyle = "#6b4026"; g.fillRect(hx, hy, hw, wh * 0.13);
      g.fillStyle = "#f2b24a"; g.fillRect(hx + hw * 0.12, hy + wh * 0.03, hw * 0.76, wh * 0.06);
      g.fillStyle = "#f6f4ef"; g.beginPath(); g.moveTo(hx - hw * 0.12, hy); g.lineTo(hx + hw / 2, hy - wh * 0.08); g.lineTo(hx + hw * 1.12, hy); g.fill();
    }
    for (var i = 0; i <= 14; i++) {
      var t = i / 14, lx = wx + t * ww, ly = wy + wh * 0.5 + Math.sin(t * Math.PI) * wh * 0.07;
      g.fillStyle = "rgba(255,214,120,0.95)"; g.beginPath(); g.arc(lx, ly, 1.6 * S + 0.5, 0, 7); g.fill();
    }
    // a Herrnhut star hanging in the window
    var sx = wx + ww * 0.5, sy = wy + ww * 0.34, sr = ww * 0.13;
    g.strokeStyle = "rgba(255,255,255,0.35)"; g.lineWidth = 1; g.beginPath(); g.moveTo(sx, wy); g.lineTo(sx, sy - sr); g.stroke();
    var glow = g.createRadialGradient(sx, sy, 1, sx, sy, sr * 2.4);
    glow.addColorStop(0, "rgba(255,210,130,0.45)"); glow.addColorStop(1, "rgba(255,210,130,0)");
    g.fillStyle = glow; g.fillRect(sx - sr * 3, sy - sr * 3, sr * 6, sr * 6);
    for (var p = 0; p < 13; p++) {
      var a = -Math.PI / 2 + p * 2 * Math.PI / 13;
      g.fillStyle = p % 2 ? "#e9b84f" : "#fbe3a0";
      g.beginPath(); g.moveTo(sx + Math.cos(a - 0.24) * sr * 0.32, sy + Math.sin(a - 0.24) * sr * 0.32);
      g.lineTo(sx + Math.cos(a) * sr, sy + Math.sin(a) * sr);
      g.lineTo(sx + Math.cos(a + 0.24) * sr * 0.32, sy + Math.sin(a + 0.24) * sr * 0.32); g.fill();
    }
    g.fillStyle = "#fff1c4"; g.beginPath(); g.arc(sx, sy, sr * 0.3, 0, 7); g.fill();
    g.restore();
    g.strokeStyle = "#5b3b25"; g.lineWidth = 9 * S; arch(g, wy + wh); g.stroke();
    g.lineWidth = 4 * S; g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.moveTo(wx, wy + wh * 0.62); g.lineTo(wx + ww, wy + wh * 0.62); g.stroke();
    g.fillStyle = "#6a4730"; g.fillRect(wx - 12 * S, wy + wh, ww + 24 * S, 10 * S);

    // bookshelves
    function inWindow(x0, x1, y0, y1) { return x1 > wx + 2 && x0 < wx + ww - 2 && y0 < wy + wh + 14 * S; }
    var targetRow = narrow ? Math.min(winRows, rows.length - 1) : Math.max(0, rows.length - 2), targetX = narrow ? W * 0.5 : W * 0.68;

    rows.forEach(function (ry, ri) {
      bays.forEach(function (bx0) {
        var x0 = bx0 + upright / 2, x1 = bx0 + bayW - upright / 2;
        if (inWindow(x0, x1, ry, ry + shelfH)) return;
        var back = g.createLinearGradient(0, ry, 0, ry + shelfH);
        back.addColorStop(0, "#140d09"); back.addColorStop(1, "#24170f");
        g.fillStyle = back; g.fillRect(x0, ry, x1 - x0, shelfH);
        var bx = x0 + 3 * S, floor = ry + shelfH - board;
        var special = ri === targetRow && targetX >= bx0 && targetX < bx0 + bayW;
        var stackAt = special ? x0 + 8 * S : (R() < 0.25 ? x0 + (x1 - x0) * (0.2 + R() * 0.5) : -1);
        while (bx < x1 - 6 * S) {
          if (stackAt > 0 && bx >= stackAt) {
            // books lying on their sides
            var sw = Math.min(x1 - bx - 4 * S, special ? (x1 - x0) * 0.9 : (70 + R() * 50) * S);
            var sy0 = floor, n = special ? 3 : 2 + (R() * 3 | 0);
            for (var s = 0; s < n; s++) {
              var hero = special && s === 1;
              var th = hero ? Math.max(19, 19 * S) : (9 + R() * 8) * S;
              var inset = hero ? 0 : (R() * 10 - 5) * S, swk = sw - Math.abs(inset) - (hero ? 0 : R() * 14 * S);
              g.fillStyle = hero ? "#4c1d24" : BOOK[(R() * BOOK.length) | 0];
              g.fillRect(bx + Math.max(0, inset), sy0 - th, swk, th);
              g.fillStyle = "rgba(255,255,255,0.08)"; g.fillRect(bx + Math.max(0, inset), sy0 - th, swk, 1.2 * S);
              g.fillStyle = "rgba(0,0,0,0.25)"; g.fillRect(bx + Math.max(0, inset), sy0 - 1.2 * S, swk, 1.2 * S);
              if (hero) L.book = { x: bx + Math.max(0, inset), y: sy0 - th, w: swk, h: th };
              else if (R() < 0.6) { g.fillStyle = "rgba(217,191,122,0.55)"; g.fillRect(bx + Math.max(0, inset) + swk * 0.15, sy0 - th / 2 - 0.6 * S, swk * (0.3 + R() * 0.4), 1.2 * S); }
              sy0 -= th;
            }
            bx += sw + 4 * S; stackAt = -1; continue;
          }
          var bw = (10 + R() * 16) * S, bh = shelfH * (0.58 + R() * 0.32);
          if (bx + bw > x1 - 3 * S) break;
          var lean = R() < 0.06 && bx + bw + 30 * S < x1;
          g.save();
          if (lean) { g.translate(bx, floor); g.rotate(-0.22); g.translate(-bx, -floor); }
          g.fillStyle = BOOK[(R() * BOOK.length) | 0]; g.fillRect(bx, floor - bh, bw, bh);
          var shade = g.createLinearGradient(bx, 0, bx + bw, 0);
          shade.addColorStop(0, "rgba(255,255,255,0.10)"); shade.addColorStop(0.35, "rgba(255,255,255,0)"); shade.addColorStop(1, "rgba(0,0,0,0.30)");
          g.fillStyle = shade; g.fillRect(bx, floor - bh, bw, bh);
          if (R() < 0.75) {
            g.fillStyle = "rgba(217,191,122," + (0.35 + R() * 0.35) + ")";
            g.fillRect(bx + 1, floor - bh + bh * 0.1, bw - 2, 1.3 * S);
            g.fillRect(bx + 1, floor - bh * 0.18, bw - 2, 1.3 * S);
            if (R() < 0.5) g.fillRect(bx + bw * 0.35, floor - bh * 0.7, bw * 0.3, bh * 0.28);
          }
          g.restore();
          bx += bw + (R() < 0.12 ? (8 + R() * 18) * S : 0.6 * S) + (lean ? 12 * S : 0);
        }
        var bd = g.createLinearGradient(0, floor, 0, floor + board);
        bd.addColorStop(0, "#7a5235"); bd.addColorStop(1, "#4a301f");
        g.fillStyle = bd; g.fillRect(x0 - upright / 2, floor, x1 - x0 + upright, board);
      });
    });
    bays.forEach(function (bx0) {
      var up = g.createLinearGradient(bx0 - upright / 2, 0, bx0 + upright / 2, 0);
      up.addColorStop(0, "#4a301f"); up.addColorStop(0.5, "#6e4a30"); up.addColorStop(1, "#3c2718");
      g.fillStyle = up;
      rows.forEach(function (ry) { if (!inWindow(bx0 - upright, bx0 + upright, ry, ry + shelfH)) g.fillRect(bx0 - upright / 2, ry, upright, shelfH); });
    });

    // the one spine with a readable title
    if (L.book) {
      var bk = L.book, fs = bk.h * 0.58;
      g.font = bookFont(fs);
      var tw = g.measureText(TITLE).width;
      if (tw > bk.w * 0.86) { fs *= bk.w * 0.86 / tw; g.font = bookFont(fs); }
      g.textBaseline = "middle"; g.textAlign = "center";
      var cx = bk.x + bk.w / 2, cy = bk.y + bk.h / 2 + fs * 0.06;
      g.fillStyle = "rgba(0,0,0,0.5)"; g.fillText(TITLE, cx + 0.6, cy + 0.8);
      g.fillStyle = "#d9bf7a"; g.fillText(TITLE, cx, cy);
      g.fillStyle = "rgba(217,191,122,0.7)";
      g.fillRect(bk.x + 3 * S, bk.y + 2.5, 1.2 * S, bk.h - 5);
      g.fillRect(bk.x + bk.w - 4.2 * S, bk.y + 2.5, 1.2 * S, bk.h - 5);
    }

    // fairy-light garland along the top shelf
    for (var gi = 0; gi < 2; gi++) {
      var gy = shelfTop + (gi ? 16 : 4) * S, sag = 26 * S, span = W / (narrow ? 2 : 3);
      g.strokeStyle = "rgba(40,60,30,0.9)"; g.lineWidth = 2 * S;
      g.beginPath();
      for (var gx = 0; gx <= W; gx += 6) { var u = (gx % span) / span, yy = gy + Math.sin(u * Math.PI) * sag; if (gx === 0) g.moveTo(gx, yy); else g.lineTo(gx, yy); }
      g.stroke();
      for (gx = 10 + gi * 14; gx < W; gx += 28 * S) {
        var u2 = (gx % span) / span, y2 = gy + Math.sin(u2 * Math.PI) * sag;
        var bg = g.createRadialGradient(gx, y2, 0, gx, y2, 10 * S);
        bg.addColorStop(0, "rgba(255,220,140,0.55)"); bg.addColorStop(1, "rgba(255,220,140,0)");
        g.fillStyle = bg; g.fillRect(gx - 10 * S, y2 - 10 * S, 20 * S, 20 * S);
        g.fillStyle = "#ffe3a0"; g.beginPath(); g.arc(gx, y2 + 2 * S, 2.2 * S, 0, 7); g.fill();
      }
    }

    // café table
    var tg = g.createLinearGradient(0, tableY, 0, H);
    tg.addColorStop(0, "#6b4329"); tg.addColorStop(0.08, "#4d2f1c"); tg.addColorStop(1, "#2b190f");
    g.fillStyle = tg; g.fillRect(0, tableY, W, H - tableY);
    g.fillStyle = "rgba(255,225,180,0.18)"; g.fillRect(0, tableY, W, 2 * S);
    for (var wg = 0; wg < 14; wg++) {
      g.strokeStyle = "rgba(0,0,0," + (0.06 + R() * 0.08) + ")"; g.lineWidth = 1;
      var yy0 = tableY + (H - tableY) * R(); g.beginPath(); g.moveTo(0, yy0);
      g.bezierCurveTo(W * 0.3, yy0 + (R() - 0.5) * 12, W * 0.7, yy0 + (R() - 0.5) * 12, W, yy0 + (R() - 0.5) * 8); g.stroke();
    }

    // Glühwein on a saucer, with orange, cinnamon and star anise
    var mS = Math.min(1.25, Math.max(0.7, (H - tableY) / 190)) * (narrow ? 0.95 : 1.1);
    var mx = W * (narrow ? 0.42 : 0.6), my = tableY + (H - tableY) * 0.55;
    g.fillStyle = "rgba(0,0,0,0.35)"; g.beginPath(); g.ellipse(mx + 8 * mS, my + 6 * mS, 78 * mS, 16 * mS, 0, 0, 7); g.fill();
    g.fillStyle = "#e9e2d4"; g.beginPath(); g.ellipse(mx, my, 74 * mS, 15 * mS, 0, 0, 7); g.fill();
    g.fillStyle = "#cfc6b5"; g.beginPath(); g.ellipse(mx, my - 2 * mS, 50 * mS, 9 * mS, 0, 0, 7); g.fill();
    var mw = 70 * mS, mh = 78 * mS, mTop = my - mh;
    g.strokeStyle = "#a82326"; g.lineWidth = 11 * mS; g.beginPath(); g.ellipse(mx + mw / 2 + 4 * mS, my - mh * 0.5, 15 * mS, 20 * mS, 0, -1.4, 1.4); g.stroke();
    var mug = g.createLinearGradient(mx - mw / 2, 0, mx + mw / 2, 0);
    mug.addColorStop(0, "#8f1c20"); mug.addColorStop(0.35, "#c9343a"); mug.addColorStop(1, "#7a171b");
    g.fillStyle = mug; g.beginPath(); g.roundRect(mx - mw / 2, mTop, mw, mh, [4 * mS, 4 * mS, 14 * mS, 14 * mS]); g.fill();
    g.fillStyle = "#3a0d10"; g.beginPath(); g.ellipse(mx, mTop, mw / 2, 7 * mS, 0, 0, 7); g.fill();
    g.fillStyle = "#5c1416"; g.beginPath(); g.ellipse(mx, mTop + 1.5 * mS, mw / 2 - 4 * mS, 5 * mS, 0, 0, 7); g.fill();
    g.fillStyle = "#f4ead6"; star(g, mx - 2 * mS, mTop + mh * 0.52, 15 * mS, 6.2 * mS, 5, -Math.PI / 2); g.fill();
    L.steam = { x: mx, y: mTop - 4 * mS, s: mS };
    var ox = mx - 112 * mS, oy = my + 8 * mS;
    g.fillStyle = "#e5862f"; g.beginPath(); g.ellipse(ox, oy, 24 * mS, 9 * mS, -0.15, 0, 7); g.fill();
    g.fillStyle = "#f6b55a"; g.beginPath(); g.ellipse(ox, oy - 1 * mS, 20 * mS, 7 * mS, -0.15, 0, 7); g.fill();
    g.strokeStyle = "rgba(255,240,200,0.7)"; g.lineWidth = 1;
    for (var sg = 0; sg < 8; sg++) { var aa = sg * Math.PI / 4; g.beginPath(); g.moveTo(ox, oy - 1 * mS); g.lineTo(ox + Math.cos(aa) * 19 * mS, oy - 1 * mS + Math.sin(aa) * 6.5 * mS); g.stroke(); }
    g.save(); g.translate(mx + 114 * mS, my + 6 * mS); g.rotate(-0.25);
    g.fillStyle = "#7a3f1d"; g.beginPath(); g.roundRect(-30 * mS, -5 * mS, 60 * mS, 8 * mS, 3 * mS); g.fill();
    g.fillStyle = "#8f4d25"; g.beginPath(); g.roundRect(-28 * mS, 2 * mS, 58 * mS, 7 * mS, 3 * mS); g.fill();
    g.restore();
    g.fillStyle = "#5a2e16"; star(g, mx + 94 * mS, my - 18 * mS, 11 * mS, 4 * mS, 8, 0.2); g.fill();

    // lamplight and vignette
    var lamp = g.createRadialGradient(W * 0.62, tableY * 0.35, 10, W * 0.6, tableY * 0.5, Math.max(W, H) * 0.8);
    lamp.addColorStop(0, "rgba(255,190,110,0.16)"); lamp.addColorStop(0.6, "rgba(255,170,90,0.05)"); lamp.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = lamp; g.fillRect(0, 0, W, H);
    var vig = g.createRadialGradient(W / 2, H * 0.5, Math.min(W, H) * 0.3, W / 2, H * 0.5, Math.max(W, H) * 0.78);
    vig.addColorStop(0, "rgba(0,0,0,0)"); vig.addColorStop(1, "rgba(8,4,2,0.6)");
    g.fillStyle = vig; g.fillRect(0, 0, W, H);
  }

  function initFx() {
    var R = rng(31), w = L.win;
    flakes = [];
    for (var i = 0; i < Math.round(w.w * w.h / 2600); i++) flakes.push({ x: w.x + R() * w.w, y: w.y + R() * w.h, r: 0.6 + R() * 1.6, v: 8 + R() * 18, d: R() * 6.28 });
  }
  function drawFx(t) {
    fc.setTransform(dpr, 0, 0, dpr, 0, 0);
    fc.clearRect(0, 0, W, H);
    var w = L.win;
    fc.save();
    fc.beginPath(); fc.moveTo(w.x, w.y + w.h * 0.82); fc.lineTo(w.x, w.y + w.w / 2); fc.arc(w.x + w.w / 2, w.y + w.w / 2, w.w / 2, Math.PI, 0); fc.lineTo(w.x + w.w, w.y + w.h * 0.82); fc.closePath(); fc.clip();
    fc.fillStyle = "rgba(255,255,255,0.85)";
    flakes.forEach(function (f) {
      var y = w.y + ((f.y - w.y + f.v * t) % w.h), x = f.x + Math.sin(t * 0.8 + f.d) * 4;
      fc.beginPath(); fc.arc(x, y, f.r, 0, 7); fc.fill();
    });
    fc.restore();
    var st = L.steam;
    if (st) {
      fc.lineCap = "round";
      for (var k = 0; k < 3; k++) {
        var ph = t * 0.9 + k * 2.1, off = (k - 1) * 16 * st.s;
        fc.strokeStyle = "rgba(255,245,235," + (0.16 + 0.08 * Math.sin(ph)) + ")";
        fc.lineWidth = 3 * st.s;
        fc.beginPath();
        for (var j = 0; j <= 20; j++) {
          var u = j / 20, yy = st.y - u * 70 * st.s, xx = st.x + off + Math.sin(u * 5 + ph) * 7 * st.s * u;
          if (j === 0) fc.moveTo(xx, yy); else fc.lineTo(xx, yy);
        }
        fc.stroke();
      }
    }
  }
  function loop(now) { drawFx(now / 1000); raf = requestAnimationFrame(loop); }

  function layout() {
    cancelAnimationFrame(raf);
    W = window.innerWidth; H = window.innerHeight; dpr = Math.min(2, window.devicePixelRatio || 1);
    S = Math.max(0.75, Math.min(1.2, Math.min(W, H * 1.1) / 900));
    cv.width = fx.width = W * dpr; cv.height = fx.height = H * dpr;
    L = {};
    drawScene();
    if (L.book) {
      var px = 8, py = Math.max(8, (44 - L.book.h) / 2);
      bookBtn.style.left = (L.book.x - px) + "px"; bookBtn.style.top = (L.book.y - py) + "px";
      bookBtn.style.width = (L.book.w + px * 2) + "px"; bookBtn.style.height = (L.book.h + py * 2) + "px";
    }
    initFx();
    cv.classList.add("on");
    if (reduce) drawFx(0); else raf = requestAnimationFrame(loop);
  }

  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layout, 150); });
  document.addEventListener("visibilitychange", function () { cancelAnimationFrame(raf); if (!document.hidden && !reduce) raf = requestAnimationFrame(loop); });
  (document.fonts && document.fonts.load ? document.fonts.load("700 20px 'Cormorant Garamond'") : Promise.resolve())
    .catch(function () {}).then(layout);

  /* ---------- the gate ---------- */
  var gate = document.getElementById("gate"), veil = document.getElementById("veil");
  var pass = document.getElementById("pass"), msg = document.getElementById("msg"), enter = document.getElementById("enter");
  var remember = document.getElementById("remember");
  var boxP = null;
  function box() {
    if (!boxP) boxP = fetch("garden.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error("missing"); return r.json(); });
    return boxP;
  }
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function unb64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function norm(p) { return p.trim().toLowerCase().replace(/[\s_-]+/g, "-"); }
  function derive(p, bx, extractable) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(norm(p)), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(bx.salt), iterations: bx.iter }, base, { name: "AES-GCM", length: 256 }, extractable, ["decrypt"]);
    });
  }
  function openWith(key, bx) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(bx.iv) }, key, b64(bx.ct)).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function enterGarden(html) { cancelAnimationFrame(raf); document.open(); document.write(html); document.close(); }
  function saved() { try { return JSON.parse(localStorage.getItem("okay.key") || "null"); } catch (e) { return null; } }
  function showGate() { gate.hidden = false; veil.classList.add("on"); requestAnimationFrame(function () { gate.classList.add("on"); pass.focus(); }); }
  function hideGate() {
    gate.classList.remove("on"); veil.classList.remove("on");
    setTimeout(function () { gate.hidden = true; msg.textContent = ""; }, reduce ? 0 : 350);
    bookBtn.focus();
  }

  bookBtn.addEventListener("click", function () {
    if (!window.crypto || !crypto.subtle) { showGate(); msg.textContent = "This browser can't open the book. Try a current Safari, Chrome or Firefox."; return; }
    var s = saved();
    box().then(function (bx) {
      if (s && s.salt === bx.salt) {
        return crypto.subtle.importKey("raw", b64(s.key), { name: "AES-GCM" }, false, ["decrypt"])
          .then(function (k) { return openWith(k, bx); })
          .then(enterGarden)
          .catch(function () { try { localStorage.removeItem("okay.key"); } catch (e) {} showGate(); });
      }
      showGate();
    }).catch(function () { showGate(); msg.textContent = "The page couldn't be reached. Check your connection and try again."; });
  });
  document.getElementById("close").addEventListener("click", hideGate);
  veil.addEventListener("click", hideGate);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !gate.hidden) hideGate(); });

  gate.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!pass.value.trim()) return;
    enter.disabled = true; msg.textContent = "";
    var bx;
    box().then(function (b) { bx = b; return derive(pass.value, bx, remember.checked); })
      .then(function (key) {
        return openWith(key, bx).then(function (html) {
          if (!remember.checked) return html;
          return crypto.subtle.exportKey("raw", key).then(function (raw) {
            try { localStorage.setItem("okay.key", JSON.stringify({ salt: bx.salt, key: unb64(raw) })); } catch (e) {}
            return html;
          });
        });
      })
      .then(enterGarden)
      .catch(function () {
        enter.disabled = false;
        msg.textContent = "That's not it.";
        gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");
        pass.select();
      });
  });
})();
</script>
</body>
