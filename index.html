<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>tap okay</title>
<meta name="theme-color" content="#151a1c">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-title" content="tap okay">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* An old garden wall at dusk, grown over with ivy. One stone is carved "okay". Single look on purpose. */
:root {
  --night: #151a1c;
  --plaque: #2b2a25;
  --plaque-edge: #4a463b;
  --brass: #c9b27c;
  --ink: #efe8d6;
  --muted: #a69f8c;
  --font-carve: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 0.7s ease; }
canvas.on { opacity: 1; }
#okay {
  position: absolute; border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer;
  border-radius: 6px; -webkit-tap-highlight-color: transparent;
}
#okay::after {
  content: ""; position: absolute; inset: -30%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 226, 160, 0.16), rgba(255, 226, 160, 0));
  opacity: 0; transition: opacity 0.6s ease;
}
#okay:hover::after, #okay:focus-visible::after { opacity: 1; }
#okay:focus-visible { outline: 1px solid rgba(239, 232, 214, 0.35); outline-offset: 4px; }
.veil { position: fixed; inset: 0; background: rgba(8, 10, 11, 0.55); opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
.veil.on { opacity: 1; pointer-events: auto; }
form#gate {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -46%);
  width: min(360px, calc(100vw - 32px)); box-sizing: border-box;
  background: linear-gradient(160deg, #34322b, var(--plaque) 60%);
  border: 1px solid var(--plaque-edge); border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 12px;
  opacity: 0; transition: opacity 0.35s ease, transform 0.35s ease;
}
form#gate.on { opacity: 1; transform: translate(-50%, -50%); }
form#gate h1 { font: italic 500 28px/1 var(--font-carve); color: var(--brass); margin: 0; letter-spacing: 0.01em; }
form#gate p { margin: 0; font-size: 13.5px; color: var(--muted); }
.row { display: flex; gap: 8px; }
#pass {
  flex: 1; min-width: 0; font: 500 16px var(--font-body); color: var(--ink);
  background: rgba(0, 0, 0, 0.28); border: 1px solid var(--plaque-edge); border-radius: 9px; padding: 10px 12px;
}
#pass:focus { outline: 2px solid var(--brass); outline-offset: 1px; border-color: transparent; }
#enter {
  font: 600 15px var(--font-body); color: #1d1b16; background: var(--brass); border: 0; border-radius: 9px; padding: 0 16px; cursor: pointer;
}
#enter:disabled { opacity: 0.6; cursor: default; }
#enter:focus-visible, #close:focus-visible, label:focus-within { outline: 2px solid var(--brass); outline-offset: 2px; }
label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; border-radius: 6px; width: fit-content; }
label input { accent-color: var(--brass); width: 16px; height: 16px; margin: 0; }
#msg { min-height: 18px; font-size: 13.5px; color: #e7a98f; }
#close { position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
.shake { animation: shake 0.38s ease; }
@keyframes shake { 20%, 60% { margin-left: -8px; } 40%, 80% { margin-left: 8px; } }
@media (prefers-reduced-motion: reduce) {
  form#gate, .veil, #okay::after, canvas { transition: none; }
  .shake { animation: none; }
}
</style>
</head>
<body>
<canvas id="wall" aria-hidden="true"></canvas>
<button id="okay" type="button" aria-label="okay"></button>
<div class="veil" id="veil"></div>
<form id="gate" hidden autocomplete="on">
  <button type="button" id="close" aria-label="Close">&times;</button>
  <h1>okay</h1>
  <p>This garden is private.</p>
  <input type="text" name="username" value="okay" autocomplete="username" hidden>
  <div class="row">
    <input id="pass" name="password" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase" required>
    <button id="enter" type="submit">Enter</button>
  </div>
  <label><input type="checkbox" id="remember" checked> Remember this device</label>
  <div id="msg" role="status" aria-live="polite"></div>
</form>

<script>
(function () {
  var cv = document.getElementById("wall"), ctx = cv.getContext("2d");
  var okayBtn = document.getElementById("okay");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W, H, S, dpr, stoneCanvas, vines, okayRect, anim = 0;

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function roundedStone(g, x, y, w, h, r, R) {
    var j = function () { return (R() - 0.5) * r * 0.9; };
    var p = [[x + j(), y + j()], [x + w + j(), y + j()], [x + w + j(), y + h + j()], [x + j(), y + h + j()]];
    g.beginPath();
    for (var i = 0; i < 4; i++) {
      var a = p[i], b = p[(i + 1) % 4], c = p[(i + 3) % 4];
      var ax = a[0] + (c[0] - a[0]) * 0.18, ay = a[1] + (c[1] - a[1]) * 0.18;
      var bx = a[0] + (b[0] - a[0]) * 0.18, by = a[1] + (b[1] - a[1]) * 0.18;
      if (i === 0) g.moveTo(ax, ay); else g.lineTo(ax, ay);
      g.quadraticCurveTo(a[0], a[1], bx, by);
    }
    g.closePath();
  }

  function drawStones() {
    var R = rng(70707);
    stoneCanvas = document.createElement("canvas");
    stoneCanvas.width = W * dpr; stoneCanvas.height = H * dpr;
    var g = stoneCanvas.getContext("2d");
    g.scale(dpr, dpr);

    // dusk sky above the wall
    var top = Math.round(H * 0.14);
    var sky = g.createLinearGradient(0, 0, 0, top + 30 * S);
    sky.addColorStop(0, "#10151c"); sky.addColorStop(1, "#3a3a3c");
    g.fillStyle = sky; g.fillRect(0, 0, W, top + 40 * S);
    for (var i = 0; i < 26; i++) {
      g.fillStyle = "rgba(255,248,230," + (0.25 + R() * 0.5) + ")";
      g.beginPath(); g.arc(R() * W, R() * top * 0.8, R() * 1.1 + 0.3, 0, 7); g.fill();
    }

    // mortar
    g.fillStyle = "#2f2c27"; g.fillRect(0, top, W, H - top);
    for (i = 0; i < W * H / 60; i++) {
      g.fillStyle = "rgba(0,0,0," + R() * 0.25 + ")";
      g.fillRect(R() * W, top + R() * (H - top), 1.3, 1.3);
    }

    // coping stones on top of the wall
    var copeH = 26 * S, x = -R() * 40 * S;
    while (x < W) {
      var cw = (90 + R() * 70) * S;
      roundedStone(g, x + 2, top, cw - 4, copeH, 8 * S, R);
      var cg = g.createLinearGradient(0, top, 0, top + copeH);
      var l = 52 + R() * 8;
      cg.addColorStop(0, "hsl(38,10%," + (l + 8) + "%)"); cg.addColorStop(1, "hsl(36,9%," + (l - 10) + "%)");
      g.fillStyle = cg; g.fill();
      x += cw;
    }

    // stone courses
    var y = top + copeH + 3 * S, rows = [];
    while (y < H) {
      var rh = (34 + R() * 22) * S;
      var row = [];
      x = -R() * 60 * S;
      while (x < W) {
        var w = rh * (1.25 + R() * 1.5);
        row.push([x, y, w, rh]);
        x += w;
      }
      rows.push(row);
      y += rh;
    }

    // the okay stone: lower right third, a wide stone
    var target = rows[Math.min(rows.length - 2, Math.max(1, Math.round(rows.length * 0.62)))];
    var best = null;
    target.forEach(function (s) {
      var cx = s[0] + s[2] / 2, score = Math.abs(cx - W * 0.68) - s[2] * 0.6;
      if (s[0] > 10 && s[0] + s[2] < W - 10 && (!best || score < best.score)) best = { s: s, score: score };
    });
    if (best) {
      var bs = best.s;
      if (bs[2] < 110 * S) bs[2] = 110 * S;
      okayRect = { x: bs[0] + 3 * S, y: bs[1] + 3 * S, w: bs[2] - 6 * S, h: bs[3] - 6 * S };
    }

    rows.forEach(function (row) {
      row.forEach(function (s) {
        var m = 3 * S;
        roundedStone(g, s[0] + m, s[1] + m, s[2] - 2 * m, s[3] - 2 * m, 9 * S, R);
        var hue = 26 + R() * 16, sat = 6 + R() * 12, lit = 34 + R() * 15;
        var sg = g.createLinearGradient(s[0], s[1], s[0] + s[2] * 0.3, s[1] + s[3]);
        sg.addColorStop(0, "hsl(" + hue + "," + sat + "%," + (lit + 7) + "%)");
        sg.addColorStop(1, "hsl(" + hue + "," + sat + "%," + (lit - 9) + "%)");
        g.save(); g.fillStyle = sg; g.fill(); g.clip();
        for (var k = 0; k < s[2] * s[3] / 22; k++) {
          g.fillStyle = (R() < 0.5 ? "rgba(0,0,0," : "rgba(255,250,235,") + (R() * 0.09) + ")";
          g.fillRect(s[0] + R() * s[2], s[1] + R() * s[3], 1.6 * S, 1.6 * S);
        }
        if (R() < 0.35) {
          var lg = g.createRadialGradient(s[0] + R() * s[2], s[1] + R() * s[3], 1, s[0] + s[2] / 2, s[1] + s[3] / 2, s[2] * 0.6);
          lg.addColorStop(0, "rgba(96,110,70,0.28)"); lg.addColorStop(1, "rgba(96,110,70,0)");
          g.fillStyle = lg; g.fillRect(s[0], s[1], s[2], s[3]);
        }
        g.restore();
        g.lineWidth = 1.2 * S;
        g.strokeStyle = "rgba(255,245,225,0.10)"; g.stroke();
      });
    });

    // moss on one stone has grown into the shape of "okay"
    if (okayRect) {
      var mw = Math.ceil(okayRect.w), mh = Math.ceil(okayRect.h);
      var mc = document.createElement("canvas"); mc.width = mw; mc.height = mh;
      var mg = mc.getContext("2d");
      var fs = Math.min(mh * 0.95, mw * 0.42);
      mg.font = fs + "px 'Pinyon Script', 'Snell Roundhand', cursive";
      mg.textAlign = "center"; mg.textBaseline = "middle";
      mg.fillStyle = "#000"; mg.fillText("okay", mw / 2, mh / 2 + fs * 0.08);
      var px = mg.getImageData(0, 0, mw, mh).data;
      var MR = rng(808);
      for (var yy = 0; yy < mh; yy += 1) {
        for (var xx = 0; xx < mw; xx += 1) {
          if (px[(yy * mw + xx) * 4 + 3] < 110 || MR() > 0.7) continue;
          var gx = okayRect.x + xx + (MR() - 0.5) * 1.6, gy = okayRect.y + yy + (MR() - 0.5) * 1.6;
          g.fillStyle = "hsla(" + (80 + MR() * 30) + "," + (34 + MR() * 20) + "%," + (28 + MR() * 16) + "%," + (0.5 + MR() * 0.35) + ")";
          g.beginPath(); g.arc(gx, gy, (0.7 + MR() * 0.9) * Math.max(S, 0.8), 0, 7); g.fill();
        }
      }
      // a soft halo of loose moss so the edges blur into the stone
      for (var q = 0; q < mw * mh / 30; q++) {
        var hx = MR() * mw | 0, hy = MR() * mh | 0;
        if (px[(hy * mw + hx) * 4 + 3] > 0) continue;
        g.fillStyle = "hsla(" + (80 + MR() * 25) + ",28%,26%," + (MR() * 0.18) + ")";
        g.beginPath(); g.arc(okayRect.x + hx, okayRect.y + hy, 0.6 * Math.max(S, 0.8), 0, 7); g.fill();
      }
    }

    // warm lamp light from upper right and a vignette
    var lamp = g.createRadialGradient(W * 0.78, H * 0.08, 10, W * 0.7, H * 0.3, Math.max(W, H) * 0.85);
    lamp.addColorStop(0, "rgba(255,206,140,0.24)"); lamp.addColorStop(0.5, "rgba(255,190,120,0.06)"); lamp.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = lamp; g.fillRect(0, 0, W, H);
    var vig = g.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.25, W / 2, H * 0.55, Math.max(W, H) * 0.8);
    vig.addColorStop(0, "rgba(0,0,0,0)"); vig.addColorStop(1, "rgba(5,7,8,0.62)");
    g.fillStyle = vig; g.fillRect(0, 0, W, H);
    g.fillStyle = "rgba(20,30,40,0.16)"; g.fillRect(0, 0, W, H);
  }

  function makeVines() {
    var R = rng(4242);
    vines = [];
    var top = Math.round(H * 0.14);
    var n = Math.round(W / (W < 600 ? 55 : 95)) + 5;
    var keep = okayRect ? { x: okayRect.x + okayRect.w * 0.12, y: okayRect.y + okayRect.h * 0.08, w: okayRect.w * 0.76, h: okayRect.h * 0.84 } : null;
    function blocked(x, y) { return keep && x > keep.x - 6 * S && x < keep.x + keep.w + 6 * S && y > keep.y - 6 * S && y < keep.y + keep.h + 6 * S; }
    for (var i = 0; i < n; i++) {
      var fromTop = i % 3 !== 0;
      var x = R() * W, y = fromTop ? top + 8 * S : H + 4;
      var dir = fromTop ? Math.PI / 2 : -Math.PI / 2;
      dir += (R() - 0.5) * 0.8;
      var len = Math.round((fromTop ? 70 + R() * 130 : 80 + R() * 150) * Math.max(0.8, H / 900));
      var pts = [[x, y]], leaves = [], bend = 0;
      for (var k = 0; k < len; k++) {
        bend += (R() - 0.5) * 0.18; bend *= 0.92;
        dir += bend + (fromTop ? (Math.PI / 2 - dir) * 0.02 : (-Math.PI / 2 - dir) * 0.012);
        var step = 5.5 * Math.max(S, 0.9);
        var nx = x + Math.cos(dir) * step, ny = y + Math.sin(dir) * step;
        if (blocked(nx, ny)) { dir += (R() < 0.5 ? 1 : -1) * 1.1; nx = x + Math.cos(dir) * step; ny = y + Math.sin(dir) * step; if (blocked(nx, ny)) break; }
        if (ny < top - 4 * S || ny > H + 20 || nx < -30 || nx > W + 30) break;
        x = nx; y = ny; pts.push([x, y]);
        if (k % 2 === 0 && R() < 0.9) {
          var side = (k / 2) % 2 ? 1 : -1;
          var sz = (13 + R() * 15) * S * (1 - k / len * 0.3);
          var lx = x + Math.cos(dir + side * 1.4) * sz * 0.7, ly = y + Math.sin(dir + side * 1.4) * sz * 0.7;
          if (blocked(lx, ly)) continue;
          var red = R() < 0.06;
          var col = red ? "hsl(" + (8 + R() * 16) + ",46%," + (26 + R() * 10) + "%)" : "hsl(" + (98 + R() * 34) + "," + (28 + R() * 22) + "%," + (13 + R() * 17) + "%)";
          leaves.push({ k: k, x: lx, y: ly, s: sz, a: dir + side * 1.3 + (R() - 0.5) * 0.6, c: col, v: R() < 0.5 });
        }
        if (R() < 0.03 && vines.length < n * 4) {
          // small side shoot
          var sx = x, sy = y, sd = dir + (R() < 0.5 ? 0.9 : -0.9), spts = [[sx, sy]], sl = [];
          for (var q = 0; q < 30 + R() * 40; q++) {
            sd += (R() - 0.5) * 0.3; sx += Math.cos(sd) * step; sy += Math.sin(sd) * step;
            if (blocked(sx, sy) || sy < top) break;
            spts.push([sx, sy]);
            if (q % 2 === 0) sl.push({ k: q, x: sx + Math.cos(sd + 1.4) * 8 * S, y: sy + Math.sin(sd + 1.4) * 8 * S, s: (11 + R() * 11) * S, a: sd + 1.3 * (q % 4 ? 1 : -1), c: "hsl(" + (98 + R() * 30) + ",36%," + (15 + R() * 16) + "%)", v: R() < 0.5 });
          }
          vines.push({ pts: spts, leaves: sl, start: k / len, w: 1.3 * S });
        }
      }
      vines.push({ pts: pts, leaves: leaves, start: 0, w: 2 * S });
    }
  }

  function leaf(g, l, scale, flat) {
    var s = l.s * scale;
    if (s < 0.5) return;
    g.save(); g.translate(l.x, l.y); g.rotate(l.a);
    g.beginPath();
    g.moveTo(s * 0.12, 0);
    g.bezierCurveTo(s * -0.02, -s * 0.22, s * 0.02, -s * 0.52, s * 0.2, -s * 0.62);
    g.bezierCurveTo(s * 0.3, -s * 0.5, s * 0.36, -s * 0.38, s * 0.44, -s * 0.34);
    g.bezierCurveTo(s * 0.62, -s * 0.42, s * 0.78, -s * 0.3, s * 0.82, -s * 0.18);
    g.bezierCurveTo(s * 0.9, -s * 0.1, s * 1.0, -s * 0.04, s * 1.08, 0);
    g.bezierCurveTo(s * 1.0, s * 0.04, s * 0.9, s * 0.1, s * 0.82, s * 0.18);
    g.bezierCurveTo(s * 0.78, s * 0.3, s * 0.62, s * 0.42, s * 0.44, s * 0.34);
    g.bezierCurveTo(s * 0.36, s * 0.38, s * 0.3, s * 0.5, s * 0.2, s * 0.62);
    g.bezierCurveTo(s * 0.02, s * 0.52, s * -0.02, s * 0.22, s * 0.12, 0);
    g.fillStyle = l.c; g.fill();
    if (flat) { g.restore(); return; }
    g.strokeStyle = "rgba(0,0,0,0.3)"; g.lineWidth = 0.7; g.stroke();
    if (l.v) {
      g.beginPath(); g.moveTo(s * 0.14, 0); g.lineTo(s * 0.95, 0);
      g.moveTo(s * 0.18, 0); g.lineTo(s * 0.24, -s * 0.48); g.moveTo(s * 0.18, 0); g.lineTo(s * 0.24, s * 0.48);
      g.strokeStyle = "rgba(210,230,170,0.22)"; g.lineWidth = 0.7; g.stroke();
    }
    g.restore();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(stoneCanvas, 0, 0, W, H);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    vines.forEach(function (v) {
      ctx.beginPath(); ctx.moveTo(v.pts[0][0], v.pts[0][1]);
      for (var i = 1; i < v.pts.length; i++) ctx.lineTo(v.pts[i][0], v.pts[i][1]);
      ctx.strokeStyle = "rgba(70,62,40,0.9)"; ctx.lineWidth = v.w; ctx.stroke();
    });
    // shadows first (one cheap pass, no blur), then the leaves
    vines.forEach(function (v) {
      v.leaves.forEach(function (l) {
        leaf(ctx, { x: l.x + 1.2 * S, y: l.y + 2 * S, s: l.s, a: l.a, c: "rgba(0,0,0,0.30)", v: false }, 1, true);
      });
    });
    vines.forEach(function (v) { v.leaves.forEach(function (l) { leaf(ctx, l, 1); }); });
  }

  function layout() {
        W = window.innerWidth; H = window.innerHeight; dpr = Math.min(2, window.devicePixelRatio || 1);
    S = Math.max(0.62, Math.min(1.25, Math.min(W, H * 1.2) / 900));
    cv.width = W * dpr; cv.height = H * dpr;
    drawStones(); makeVines();
    if (okayRect) {
      var px = 10, py = Math.max(6, (44 - okayRect.h) / 2);
      okayBtn.style.left = (okayRect.x - px) + "px"; okayBtn.style.top = (okayRect.y - py) + "px";
      okayBtn.style.width = (okayRect.w + px * 2) + "px"; okayBtn.style.height = (okayRect.h + py * 2) + "px";
    }
    render();
    cv.classList.add("on");
  }

  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layout, 150); });
  (document.fonts && document.fonts.load ? Promise.all([document.fonts.load("40px 'Pinyon Script'"), document.fonts.load("italic 500 28px 'Cormorant Garamond'")]) : Promise.resolve())
    .catch(function () {}).then(layout);

  /* ---------- the gate ---------- */
  var gate = document.getElementById("gate"), veil = document.getElementById("veil");
  var pass = document.getElementById("pass"), msg = document.getElementById("msg"), enter = document.getElementById("enter");
  var remember = document.getElementById("remember");
  var boxP = null;
  function box() {
    if (!boxP) boxP = fetch("garden.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error("missing"); return r.json(); });
    return boxP;
  }
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function unb64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function norm(p) { return p.trim().toLowerCase().replace(/[\s_-]+/g, "-"); }
  function derive(p, bx, extractable) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(norm(p)), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(bx.salt), iterations: bx.iter }, base, { name: "AES-GCM", length: 256 }, extractable, ["decrypt"]);
    });
  }
  function openWith(key, bx) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(bx.iv) }, key, b64(bx.ct)).then(function (buf) {
      return new TextDecoder().decode(buf);
    });
  }
  function enterGarden(html) {
    document.open(); document.write(html); document.close();
  }
  function saved() { try { return JSON.parse(localStorage.getItem("okay.key") || "null"); } catch (e) { return null; } }

  function showGate() {
    gate.hidden = false; veil.classList.add("on");
    requestAnimationFrame(function () { gate.classList.add("on"); pass.focus(); });
  }
  function hideGate() {
    gate.classList.remove("on"); veil.classList.remove("on");
    setTimeout(function () { gate.hidden = true; msg.textContent = ""; }, reduce ? 0 : 350);
    okayBtn.focus();
  }

  okayBtn.addEventListener("click", function () {
    if (!window.crypto || !crypto.subtle) { showGate(); msg.textContent = "This browser can't unlock the garden. Try a current Safari, Chrome or Firefox."; return; }
    var s = saved();
    box().then(function (bx) {
      if (s && s.salt === bx.salt) {
        return crypto.subtle.importKey("raw", b64(s.key), { name: "AES-GCM" }, false, ["decrypt"])
          .then(function (k) { return openWith(k, bx); })
          .then(enterGarden)
          .catch(function () { try { localStorage.removeItem("okay.key"); } catch (e) {} showGate(); });
      }
      showGate();
    }).catch(function () { showGate(); msg.textContent = "The garden couldn't be reached. Check your connection and try again."; });
  });
  document.getElementById("close").addEventListener("click", hideGate);
  veil.addEventListener("click", hideGate);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !gate.hidden) hideGate(); });

  gate.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!pass.value.trim()) return;
    enter.disabled = true; msg.textContent = "";
    var bx;
    box().then(function (b) { bx = b; return derive(pass.value, bx, remember.checked); })
      .then(function (key) {
        return openWith(key, bx).then(function (html) {
          if (!remember.checked) return html;
          return crypto.subtle.exportKey("raw", key).then(function (raw) {
            try { localStorage.setItem("okay.key", JSON.stringify({ salt: bx.salt, key: unb64(raw) })); } catch (e) {}
            return html;
          });
        });
      })
      .then(enterGarden)
      .catch(function () {
        enter.disabled = false;
        msg.textContent = "That's not it.";
        gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");
        pass.select();
      });
  });
})();
</script>
